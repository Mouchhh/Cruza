name: Actualiser le classement Sportcorico
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Récupérer et valider le classement public
        run: python3 scripts/update-sportcorico.py
      - name: Enregistrer le classement validé
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/sportcorico-u17.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualiser le classement public Sportcorico'
            git push origin HEAD:main
          fi
      - name: Écrire le numéro de version
        run: sh scripts/stamp-sw-version.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
